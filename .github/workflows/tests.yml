name: tests

# Runs the full suite on every push and pull request. Everything here runs on Linux: the MetaTrader5
# package is Windows-only and is not needed for the tests (see README, "runs anywhere").

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

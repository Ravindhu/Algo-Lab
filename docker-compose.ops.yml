# Optional override. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.ops.yml up -d --build
services:
  mcp:
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algolab"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "plotly>=5.22,<7",
  "dash>=2.17,<4",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "scikit-learn>=1.5,<2",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "mcp>=1.2,<2",
  "anthropic>=0.40,<1",
  "joblib>=1.4,<2",
  "optuna>=3.6,<5",
]

[project.scripts]
algolab = "algolab.cli:main"

[project.optional-dependencies]
live = [
  "MetaTrader5>=5.0.45,<6; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"algolab.dashboard" = ["templates/*.html"]
